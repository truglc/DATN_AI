{% extends "base.html" %}
{% block title %}Cấu hình{% endblock %}
{% block page_title %}Cấu hình threshold và tốc độ{% endblock %}
{% block content %}
<section class="panel">
    <h2>Runtime settings</h2>
    <form method="POST" class="settings-grid">
        {% for key, value in config.items() %}
        <label>
            <span>{{ key }}</span>
            <input name="{{ key }}" value="{{ value }}">
        </label>
        {% endfor %}
        <button class="btn primary" type="submit">Lưu cấu hình</button>
    </form>
</section>
{% endblock %}
